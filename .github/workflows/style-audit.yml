name: Pythagoras Repository Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repository-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workbook with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Smart full validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/smart-edit.js --ci
      - name: Promote validated commit to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git push origin HEAD:release
