name: Materialize verified 53-page Pythagoras workbook
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download verified runtime source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aaa-runtime-source
          mkdir -p /tmp/aaa-runtime-source
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');
          const SOURCE = 'https://pythagoras-runtime-cache.vercel.app';
          const EXPECTED_SHA = '5c41e13b7d93fb63c138efa1b3508e5b6c2a5dbd2d122d2882a2aef7e1c38c2e';
          async function getText(url) {
            const r = await fetch(url, { redirect: 'follow', cache: 'no-store' });
            if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
            return r.text();
          }
          const manifest = JSON.parse(await getText(`${SOURCE}/`));
          if (manifest.archiveSha256 !== EXPECTED_SHA) throw new Error(`manifest sha ${manifest.archiveSha256}`);
          if (!Array.isArray(manifest.parts) || manifest.parts.length !== 51) throw new Error(`parts=${manifest.parts?.length}`);
          let base64 = '';
          for (const part of manifest.parts) {
            const text = (await getText(`${SOURCE}/${encodeURIComponent(part.name)}`)).trim();
            if (text.length !== part.length) throw new Error(`${part.name}: ${text.length} != ${part.length}`);
            base64 += text;
          }
          if (base64.length !== manifest.base64Length) throw new Error(`base64 length ${base64.length} != ${manifest.base64Length}`);
          const archive = Buffer.from(base64, 'base64');
          if (archive.length !== manifest.archiveBytes) throw new Error(`archive bytes ${archive.length} != ${manifest.archiveBytes}`);
          const sha = crypto.createHash('sha256').update(archive).digest('hex');
          if (sha !== EXPECTED_SHA) throw new Error(`archive sha ${sha}`);
          fs.writeFileSync('/tmp/aaa-source.tar.xz', archive);
          execFileSync('tar', ['-xJf', '/tmp/aaa-source.tar.xz', '-C', '/tmp/aaa-runtime-source'], { stdio: 'inherit' });
          console.log(`VERIFIED runtime archive ${sha}, ${manifest.parts.length} parts`);
          NODE
          PACKAGE_JSON="$(find /tmp/aaa-runtime-source -maxdepth 3 -name package.json -type f -print -quit)"
          test -n "$PACKAGE_JSON"
          PROJECT_ROOT="$(dirname "$PACKAGE_JSON")"
          test -f "$PROJECT_ROOT/SOURCE_OF_TRUTH.md"
          test -d "$PROJECT_ROOT/src/pages"
          PAGE_COUNT="$(find "$PROJECT_ROOT/src/pages" -name main.html -type f | wc -l | tr -d ' ')"
          test "$PAGE_COUNT" -eq 53
          FONT_COUNT="$(find "$PROJECT_ROOT/src/shared/fonts" -name '*.woff2' -type f -size +1000c | wc -l | tr -d ' ')"
          test "$FONT_COUNT" -ge 4
          echo "VERIFIED: $PAGE_COUNT pages, $FONT_COUNT fonts"
          printf '%s' "$PROJECT_ROOT" > /tmp/aaa-project-root

      - name: Materialize editable source into aaa
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cat /tmp/aaa-project-root)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$PROJECT_ROOT"/. .
          test -f package.json
          test -f SOURCE_OF_TRUTH.md
          test "$(find src/pages -name main.html -type f | wc -l | tr -d ' ')" -eq 53
          printf '%s\n' '' '## Repository ownership — aaa' '' '`yanivmizrachiy/aaa` is the sole editable source of truth for this standalone Pythagoras workbook.' 'All 53 page sources live directly in this repository. Future content, design, navigation, mobile and print fixes must be committed here.' 'Historical repositories and runtime caches are migration inputs only and must never overwrite later edits in `aaa`.' >> SOURCE_OF_TRUTH.md

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Verify full editable workbook
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run build
          npm run typecheck
          test -f package-lock.json
          test "$(find src/pages -name main.html -type f | wc -l | tr -d ' ')" -eq 53

      - name: Commit all editable pages to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materialize verified 53-page Pythagoras workbook in aaa'
          git push origin "HEAD:${HEAD_REF}"
