name: Import canonical 53-page Pythagoras workbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified canonical workbook
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/yanivmizrachiy/pythagoras/main/.canonical'
          mkdir -p /tmp/pythagoras-canonical
          for part in part-000 part-001 part-002 part-003; do
            curl -fsSL "$base/$part" -o "/tmp/pythagoras-canonical/$part"
          done
          cat /tmp/pythagoras-canonical/part-* > /tmp/pythagoras.b64
          base64 -d /tmp/pythagoras.b64 > /tmp/pythagoras.tar.gz
          echo '1a5fff4b9c4c845eeb36c1f2d9a4743cd4e8a8bf7f45a27230abf50f3e06a8bb  /tmp/pythagoras.tar.gz' | sha256sum -c -
      - name: Replace repo with complete ordered workbook
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/pythagoras.tar.gz
          test -f SOURCE_OF_TRUTH.md
          test -f package.json
          test "$(find src/pages -name main.html -type f | wc -l)" -eq 53
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run build
          npm run typecheck
      - name: Commit canonical workbook to aaa
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import complete canonical 53-page Pythagoras workbook'
          git push origin HEAD:main
